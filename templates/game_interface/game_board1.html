{% extends 'game_interface/base.html' %}
{% load static %}
{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Game Board View -->
        <div class="col-md-8">
            <div id="game-board" class="position-relative">
                <!-- Camera feed will be displayed here -->
                <img id="camera-feed" src="{{ camera_feed_url }}" class="img-fluid" alt="Game Board">
                
                <!-- Clickable overlay for piece selection -->
                <div id="piece-overlay" class="position-absolute top-0 start-0 w-100 h-100"></div>
            </div>
        </div>
        
        <!-- Control Panel -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5>Game Controls</h5>
                </div>
                <div class="card-body">
                    <div id="selected-piece-info"></div>
                    <div class="mt-3">
                        <button id="confirm-move" class="btn btn-primary" disabled>
                            Confirm Move
                        </button>
                        <button id="cancel-move" class="btn btn-secondary" disabled>
                            Cancel
                        </button>
                    </div>
                    <div id="status-messages" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
